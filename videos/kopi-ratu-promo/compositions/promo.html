  <script>
    const tl = gsap.timeline({ paused: true });
    const BACK = ["#bean-b1", "#bean-b2", "#bean-b3", "#bean-b4", "#bean-b5", "#bean-b6", "#bean-b7"];
    const FRONT = ["#bean-f1", "#bean-f2", "#bean-f3", "#bean-f4"];
    // Fixed per-bean turn and drift (deterministic, no randomness at draw time).
    const SPIN = [-24, 32, -40, 18, 46, -30, 22, 28, -36, 40, -20];
    const DRIFT = [-34, -22, -40, -28, -18, -36, -26, -44, -30, -24, -38];

    // ---- Beat 1 (0-1.0 s): the pouch drops onto the giant words ----
    // The giant words are on screen from frame 0 (the thumbnail); the pouch drops onto them.
    tl.fromTo("#promo-product-move", { y: -430, rotation: -14, filter: "blur(5px)" },
      { y: 0, rotation: -5, filter: "blur(0px)", duration: 0.85, ease: "power3.out" }, 0);
    tl.fromTo("#promo-product-move", { scaleX: 1, scaleY: 1 },
      { scaleX: 1.03, scaleY: 0.97, duration: 0.09, ease: "power1.out", yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, 0.82);

    // ---- Beat 2 (0.7-2.0 s): beans burst out from behind the pouch, then drift ----
    [...BACK, ...FRONT].forEach((sel, i) => {
      const el = document.querySelector(sel);
      const cx = 540 - (parseFloat(el.style.left) + parseFloat(el.style.width) / 2);
      const cy = 960 - (parseFloat(el.style.top) + parseFloat(el.style.height) / 2);
      tl.fromTo(sel, { x: cx * 0.85, y: cy * 0.85, scale: 0.2, rotation: 0, opacity: 0 },
        { x: 0, y: 0, scale: 1, rotation: SPIN[i], opacity: 1, duration: 0.8, ease: "expo.out" }, 0.7 + i * 0.03);
      tl.fromTo(sel, { y: 0 }, { y: DRIFT[i], rotation: SPIN[i] * 1.8, duration: 10.4, ease: "none", immediateRender: false }, 1.6);
    });

    // JRM logo, top left
    tl.fromTo("#copy-logo-img", { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, 1.1);

    // ---- Beat 3 (1.6-5.0 s): tagline, then one callout above the pouch, word by word ----
    tl.fromTo("#copy-tagline .w", { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.09 }, 1.6);
    tl.fromTo("#copy-herba .w", { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.07 }, 1.7);
    // everything on the gold ground leaves cleanly before the colour change
    tl.fromTo(["#copy-logo-img", "#copy-tagline .w"], { opacity: 1, filter: "blur(0px)" },
      { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in", immediateRender: false }, 4.75);
    tl.fromTo("#copy-herba .w", { opacity: 1, filter: "blur(0px)" },
      { opacity: 0, filter: "blur(8px)", duration: 0.13, ease: "power2.in", immediateRender: false }, 4.85);

    // ---- Beat 4 (5.0-7.6 s): colour flood to cream, stacked words slide in, pouch swings ----
    tl.fromTo(".giant-row span", { yPercent: 0, opacity: 1 }, { yPercent: 30, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.02, immediateRender: false }, 4.95);
    tl.fromTo("#promo-ground-cream", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut", immediateRender: false }, 5.0);
    tl.fromTo(["#stack-1", "#stack-2", "#stack-3"], { xPercent: -110 },
      { xPercent: 0, duration: 0.7, ease: "expo.out", stagger: 0.08 }, 5.1);
    tl.fromTo(["#stack-4", "#stack-5", "#stack-6"], { xPercent: 110 },
      { xPercent: 0, duration: 0.7, ease: "expo.out", stagger: 0.08 }, 5.2);
    // the rows keep sliding slowly, in opposite directions
    tl.fromTo(["#stack-1", "#stack-3", "#stack-5"], { x: 0 }, { x: -170, duration: 6.2, ease: "none", immediateRender: false }, 5.8);
    tl.fromTo(["#stack-2", "#stack-4", "#stack-6"], { x: 0 }, { x: 170, duration: 6.2, ease: "none", immediateRender: false }, 5.8);
    tl.fromTo("#promo-product-move", { rotation: -5 }, { rotation: 5, duration: 0.6, ease: "power2.inOut", immediateRender: false }, 5.0);
    tl.fromTo("#copy-serving-pill", { scale: 0.6, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 5.6);
    tl.fromTo("#copy-serving-pill", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in", immediateRender: false }, 7.2);

    // ---- Beat 5 (7.6-12 s): end card with the call to action ----
    // the stacked words step back to a faint texture so the end card reads
    tl.fromTo("#promo-stack", { opacity: 1 }, { opacity: 0.13, duration: 0.45, ease: "power2.inOut", immediateRender: false }, 7.3);
    tl.fromTo("#promo-product-move", { y: 0, scale: 1, rotation: 5 }, { y: -350, scale: 0.56, rotation: 0, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 7.35);
    tl.fromTo("#end-logo-img", { opacity: 0, scale: 0.86, filter: "blur(8px)" },
      { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 7.75);
    tl.fromTo("#end-url-text", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 7.8);
    // call to action: the button lands, then its words come in
    tl.fromTo("#end-cta-pill", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 8.3);
    tl.fromTo("#end-cta-pill .w", { opacity: 0, filter: "blur(6px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.06 }, 8.45);

    window.__timelines["promo"] = tl;
  </script>
