<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      #kopi {
        z-index: 1;
      }
      #mega {
        z-index: 2;
      }
      #duo {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12.5"
      data-width="1920"
      data-height="1080"
    >
      <!-- Kopi Ratu; pushed out by Mega Ratu from 3.6 s -->
      <div
        id="kopi"
        data-composition-id="kopi"
        data-composition-src="compositions/kopi.html"
        data-start="0"
        data-duration="4.25"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <!-- Mega Ratu slides in over the last 0.6 s of Kopi Ratu -->
      <div
        id="mega"
        data-composition-id="mega"
        data-composition-src="compositions/mega.html"
        data-start="3.6"
        data-duration="5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <!-- Both products side by side, names on top -->
      <div
        id="duo"
        data-composition-id="duo"
        data-composition-src="compositions/duo.html"
        data-start="7.8"
        data-duration="4.7"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
