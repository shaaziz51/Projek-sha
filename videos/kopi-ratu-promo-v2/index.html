<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f2e6cf; }
      #intro { z-index: 1; }
      #benefits { z-index: 2; }
      #reviews { z-index: 3; }
      #endcard { z-index: 4; }
      #grain { z-index: 10; }
    </style>
  </head>
  <body>
    <!-- Kopi Ratu, version 2: Coffee Touch opening and ingredients, the pour and benefits,
         customer reviews, end card with the call to action. 25.5 s, 1080x1920. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.5" data-width="1080" data-height="1920">
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="9.4" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="benefits" data-composition-id="benefits" data-composition-src="compositions/benefits.html"
        data-start="8.8" data-duration="4.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="reviews" data-composition-id="reviews" data-composition-src="compositions/reviews.html"
        data-start="13.3" data-duration="7.3" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="20.4" data-duration="5.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="grain" data-composition-id="grain" data-composition-src="compositions/grain.html"
        data-start="0" data-duration="25.5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
