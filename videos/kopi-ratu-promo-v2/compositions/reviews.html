<template>
  <style>
    @font-face { font-family: "Pinyon Script"; src: url("assets/fonts/pinyon-script-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family: "Georgia"; src: local("Georgia"), url("assets/fonts/gelasio-latin-400-normal.woff2") format("woff2"); }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      --paper: #f3e7d3;
      --ink: #54232f;
      --star: #b8770a;
    }
    #rev-ground { position: absolute; inset: 0; }
    #rev-stage { position: absolute; inset: 0; background: var(--paper); }

    /* Watercolour-poster script heading, set left with the cards (all inside x 120-780) */
    #rev-head {
      position: absolute;
      left: 124px;
      top: 312px;
      font-family: "Pinyon Script", Georgia, serif;
      font-size: 112px;
      line-height: 1.1;
      color: var(--ink);
      white-space: nowrap;
    }
    #rev-stars {
      position: absolute;
      left: 128px;
      top: 470px;
      font-family: "Georgia", serif;
      font-size: 52px;
      letter-spacing: 0.08em;
      color: var(--star);
    }
    #rev-stars span { display: inline-block; }

    /* The real review screenshots, stacking up in a window that scrolls */
    #rev-window {
      position: absolute;
      left: 120px;
      top: 556px;
      width: 660px;
      height: 692px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 60px, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 60px, #000 100%);
    }
    #rev-column { position: absolute; left: 0; top: 12px; width: 640px; }
    .card {
      position: absolute;
      left: 0;
      width: 640px;
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 18px 36px rgba(84, 35, 47, 0.18);
    }
    .card img { display: block; width: 640px; height: auto; }
    #card-1 { top: 0; }
    #card-2 { top: 212px; }
    #card-3 { top: 462px; }
    #card-4 { top: 647px; }
    #card-5 { top: 823px; }
  </style>

  <div id="root" data-composition-id="reviews" data-width="1080" data-height="1920">
    <div id="rev-ground" class="clip" data-start="0" data-duration="7.3" data-track-index="0" data-layout-allow-overflow>
      <div id="rev-stage">
        <div id="rev-head">Kata Pelanggan</div>
        <div id="rev-stars"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
        <div id="rev-window" data-layout-allow-overflow>
          <div id="rev-column">
            <div id="card-1" class="card"><img src="assets/reviews/review-1.jpg" alt="Review by a**n, 5 stars" /></div>
            <div id="card-2" class="card"><img src="assets/reviews/review-2.jpg" alt="Review by M**1, 5 stars" /></div>
            <div id="card-3" class="card"><img src="assets/reviews/review-3.jpg" alt="Review by f**e, 5 stars" /></div>
            <div id="card-4" class="card"><img src="assets/reviews/review-4.jpg" alt="Review: Kualiti produk terbaik" /></div>
            <div id="card-5" class="card"><img src="assets/reviews/review-5.jpg" alt="Review by M**s, 5 stars" /></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // 0-0.35 s: a fresh sheet of paper whips in from the right over the olive
    tl.fromTo("#rev-stage", { x: 1080 }, { x: 0, duration: 0.38, ease: "power3.out" }, 0);
    tl.fromTo("#rev-head", { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, 0.3);
    tl.fromTo("#rev-stars span", { scale: 0, transformOrigin: "50% 60%" },
      { scale: 1, duration: 0.35, ease: "back.out(2.2)", stagger: 0.07 }, 0.5);

    // 0.9-5.8 s: one review every 1.1 s; the column scrolls up once it fills the window
    const CARDS = ["#card-1", "#card-2", "#card-3", "#card-4", "#card-5"];
    const SCROLL = [0, 0, 0, -127, -312];     // column offset after each card (window 692 px tall)
    CARDS.forEach((sel, i) => {
      const at = 0.9 + i * 1.1;
      tl.fromTo(sel, { opacity: 0, y: 70, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, at);
      if (SCROLL[i] !== (SCROLL[i - 1] ?? 0)) {
        tl.fromTo("#rev-column", { y: SCROLL[i - 1] ?? 0 },
          { y: SCROLL[i], duration: 0.5, ease: "power3.inOut", immediateRender: false }, at - 0.1);
      }
    });

    // 6.95-7.25 s: clear the sheet for the end card
    tl.fromTo(["#rev-head", "#rev-stars", "#rev-window"], { opacity: 1 },
      { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, 6.95);

    window.__timelines["reviews"] = tl;
  </script>
</template>
