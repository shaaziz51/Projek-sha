<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #f2e6cf; }
      #hook { z-index: 2; }
      #intro { z-index: 1; }
      #benefits { z-index: 3; }
      #reviews { z-index: 4; }
      #endcard { z-index: 5; }
      #grain { z-index: 10; }
    </style>
  </head>
  <body>
    <!-- Kopi Ratu for Threads and X: 4:5 feed video. Customer-line hook, title and ingredients,
         the pour and benefits, two reviews, end card. 19.6 s, 1080x1350. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.6" data-width="1080" data-height="1350">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.3" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="2.1" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="benefits" data-composition-id="benefits" data-composition-src="compositions/benefits.html"
        data-start="6.4" data-duration="4.3" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="reviews" data-composition-id="reviews" data-composition-src="compositions/reviews.html"
        data-start="10.5" data-duration="4.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="15.2" data-duration="4.4" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
      <div id="grain" data-composition-id="grain" data-composition-src="compositions/grain.html"
        data-start="0" data-duration="19.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1350"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
