const DUR = 15.0;
const lerp = (a, b, p) => a + (b - a) * p;
const EASE = {}; const ease = (e) => EASE[e] || (EASE[e] = gsap.parseEase(e));
function kf(t, K) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t <= K[i][0]) {
    const [t0, v0] = K[i - 1], [t1, v1, e] = K[i];
    return lerp(v0, v1, ease(e || 'none')((t - t0) / (t1 - t0)));

  return K[K.length - 1][1];

// ---- Keys measured on the reference (720x1280): videos/reference-motion ----

const HROT = [[0, 0], [1.17, -0.7], [1.20, -3.9], [1.23, -8], [1.27, -10.5], [1.30, -9.8], [1.33, -8.8], [1.37, -6.8],

const LS = [[0, 0.28], [0.07, 0.34], [0.13, 0.52], [0.20, 0.72], [0.27, 0.86], [0.33, 0.96], [0.40, 0.99], [0.50, 1]];
const LSTRETCH = [[0, 1.5], [0.13, 1.35], [0.20, 1.05], [0.27, 1]];
const LSPIN = [[0, 0], [1.20, 0], [2.25, 360, 'power2.out']];
// size: 680 px alone; 238 px docked; then 150 / 200 / 250 / 300 % of docked as each ingredient merges (springy step)
const DOCKED = 0.35;
const SIZE = [[2.03, 1], [2.23, DOCKED, 'power3.out'],
              [7.67, DOCKED], [7.84, DOCKED * 1.5, 'back.out(2.2)'], [8.07, DOCKED * 1.5], [8.24, DOCKED * 2.0, 'back.out(2.2)'],

const CARDS = [
  { id: 'c1', t0: 3.97, gone: 7.67, item: 'grapes',

    r: [[3.97, 0], [4.23, 0], [4.60, 3]] },

        [7.97, 757], [8.07, 722], [8.13, 689], [8.20, 650], [8.27, 596], [8.33, 513], [8.40, 300, 'power2.in']],

        [8.67, 0.55, 'power2.in']],
    r: [[5.00, 0], [5.20, 1.2], [5.27, 4.3], [5.40, 3.6], [5.60, 3.0]] },
];
// flashes: each merged card (brand colours), then the box bursting
const FLASH = [[7.67, '#94050D'], [8.07, '#E1B377'], [8.40, '#FFF9F0'], [8.67, '#F2D49B'], [10.85, '#FFF9F0']];
const BURST_AT = 10.85, BURST_OUT = 11.90;   // box bursts open; ingredients leave as the end card comes in
const END_IN = 11.90;                        // grape picture end card

// ---- Reference (720x1280) -> this frame (1080x1920), inside the TikTok clear area ----
const CX = 450;
const mapX = (x) => CX + (x - 363) * 1.25;
const mapY = (t, y) => t < 3.8 ? 824 + (y - 640) * 1.5 : 0.919 * y + 227;
const BOTTLE_H = 680, ITEM_H = 150;
const ICON = [-283, -4];

// burst targets around the box and bottle: angle (deg), distance x/y (px), size (px), spin direction
const BURST = [[200, 330, 470, 170, 1], [245, 300, 560, 150, -1], [290, 260, 610, 160, 1], [335, 330, 520, 140, -1],
               [20, 360, 430, 175, 1], [65, 300, 560, 150, -1], [110, 270, 610, 165, 1], [155, 330, 520, 140, -1],
               [180, 380, 300, 130, 1]];

const $ = (id) => document.getElementById(id);
const hdr = $('hdr'), hbody = $('hbody'), glow = $('glow'), flash = $('flash'), hflash = $('hflash');
const clip = (p) => 'inset(0 ' + ((1 - p) * 100).toFixed(2) + '% 0 0)';
const iris = (p, x, y) => 'circle(' + (p * 2300).toFixed(1) + 'px at ' + x.toFixed(1) + 'px ' + y.toFixed(1) + 'px)';

function draw(t) {
  // ---- grounds: cola purple -> gold; beige -> rosy brown floods out of the header at the first merge;
  //      linen -> rosy pink bursts out of the box; the grape picture fades in for the end card ----
  const hx = mapX(kf(t, HX)), hy = mapY(t, kf(t, HY)), hr = kf(t, HROT);
  const boxX = hx, boxY = hy;                                // the box closes around the bottle, in the centre
  gsap.set('#bg2', { clipPath: iris(kf(t, [[7.67, 0], [8.10, 1, 'power2.inOut']]), hx, mapY(7.7, 200)) });
  gsap.set('#bg3', { clipPath: iris(kf(t, [[BURST_AT, 0], [BURST_AT + 0.35, 1, 'power3.out']]), boxX, boxY) });
  gsap.set('#bg4', { opacity: kf(t, [[END_IN, 0], [END_IN + 0.4, 1, 'power2.out']]), scale: kf(t, [[END_IN, 1.08], [END_IN + 0.6, 1, 'power2.out']]) });

  // ---- flashes ----
  let amt = 0, col = '#FFF9F0';
  for (const [f, c] of FLASH) if (t >= f && t < f + 0.3) { const a = 1 - (t - f) / 0.3; if (a > amt) { amt = a; col = c; } }
  const pop = 1 + 0.06 * amt;
  gsap.set(hdr, { x: hx, y: hy, rotation: hr, scale: pop });
  const fx = t >= BURST_AT ? boxX : hx;
  gsap.set(flash, { x: fx, y: hy, opacity: amt * 0.6, background: 'radial-gradient(circle, ' + col + ' 0%, transparent 62%)' });
  gsap.set(hflash, { opacity: amt * 0.85, backgroundColor: col });

  // ---- header card: opens (T3), fills (T4), rises (T5), merges (T10-T13), words go as the last card lands, folds into the bottle ----
  gsap.set(hbody, { width: kf(t, HW) * 1.25, height: kf(t, [[1.17, 110], [1.27, 170]]), autoAlpha: t >= 1.17 && t < 9.83 ? 1 : 0 });
  const out = t >= 8.07 ? Math.min(1, (t - 8.07) / 0.15) : 0;   // words leave once the growing bottle covers them
  gsap.set('#h-title', { clipPath: clip(kf(t, [[2.10, 0], [2.30, 1, 'power2.out']]) * (1 - out)) });
  gsap.set('#h-sub', { clipPath: clip(kf(t, [[2.35, 0], [2.55, 1, 'power2.out']]) * (1 - out)) });
  gsap.set('#h-size', { clipPath: clip(kf(t, [[2.50, 0], [2.70, 1, 'power2.out']]) * (1 - out)) });
  gsap.set('#hpill', { scale: kf(t, [[2.55, 0], [2.80, 1, 'back.out(1.7)']]) * (1 - out) });

  // ---- bottle ----
  const size = kf(t, LS) * kf(t, SIZE);
  const bx = kf(t, LX) * 1.376, a = hr * Math.PI / 180;
  const bShift = 0;                                          // the bottle stays in the centre, inside the box
  const endMove = kf(t, [[END_IN, 0], [END_IN + 0.45, 1, 'power3.inOut']]);
  const bAx = hx + bx * Math.cos(a) * pop + bShift, bAy = hy + bx * Math.sin(a) * pop;
  const bottle = { x: lerp(bAx, 540, endMove), y: lerp(bAy, 860, endMove), rot: hr * (1 - endMove), size: BOTTLE_H * size * pop,
                   stretch: kf(t, LSTRETCH), spin: kf(t, LSPIN) + (t > END_IN + 0.45 ? 10 * Math.sin((t - END_IN - 0.45) * Math.PI * 2 / 3) : 0) };
  gsap.set(glow, { x: bx + bShift, scale: size, opacity: (t < END_IN ? 1 : 0) * kf(t, [[2.03, 1], [2.40, 0.55], [8.84, 0.55], [9.2, 1]]) });
  gsap.set('#endglow', { x: 540, y: 860, opacity: kf(t, [[END_IN, 0], [END_IN + 0.5, 1]]) });

  // ---- 3D box: its six faces fly in and close around the bottle (the explosion played backwards), it squeezes
  //      for a beat (anticipation), then bursts open (10.85) and only the bottle is left in the centre ----
  const assemble = kf(t, [[10.30, 1], [10.70, 0, 'power3.out']]), blast = kf(t, [[BURST_AT, 0], [BURST_AT + 0.7, 1]]);
  const boxS = kf(t, [[10.70, 1], [10.80, 0.96, 'power2.inOut'], [BURST_AT, 1.03, 'power2.out']]);
  const box = { visible: t >= 10.30 && t < BURST_AT + 0.7, z: 0, x: boxX, y: boxY,
                size: BOTTLE_H * (window.megaStage3D ? window.megaStage3D.boxToBottle : 1.1) * boxS,
                rot: kf(t, [[10.70, 0], [10.76, -2], [10.82, 2], [BURST_AT, 0]]),
                spin: kf(t, [[10.30, 70], [10.70, 24, 'power3.out']]), explode: t < BURST_AT ? assemble : blast };

  // ---- ingredients burst out of the box: fly out fast and slow down, float, then fly off as the end card comes ----
  const burst = BURST.map(([ang, dx, dy, sz, dir], i) => {
    const r = ang * Math.PI / 180;
    const go = kf(t, [[BURST_AT + i * 0.02, 0], [BURST_AT + 0.55 + i * 0.02, 1, 'expo.out']]);
    const drift = 1 + 0.05 * kf(t, [[BURST_AT + 0.55, 0], [BURST_OUT, 1, 'sine.inOut']]);
    const leave = kf(t, [[BURST_OUT, 1], [BURST_OUT + 0.35, 2.4, 'power3.in']]);
    const k = go * drift * leave;
    return { visible: t >= BURST_AT && t < BURST_OUT + 0.35, z: (i % 3 - 1) * 200,
             x: boxX + Math.cos(r) * dx * k, y: boxY + Math.sin(r) * dy * k,
             size: sz * kf(t, [[BURST_AT, 0.2], [BURST_AT + 0.4, 1, 'back.out(1.6)']]),
             rot: dir * 18 * go, spin: dir * (220 * (1 - go) + 25 * Math.sin((t - BURST_AT) * Math.PI * 2 / 2.2)) };
  });

  // ---- ingredient cards ----
  const items = {};
  CARDS.forEach((c, i) => {
    const on = t >= c.t0 && t < c.gone;
    const y = mapY(t, kf(t, c.y)), s = kf(t, c.s), r = kf(t, c.r), ra = r * Math.PI / 180;
    gsap.set($(c.id), { x: CX, y, scale: s, rotation: r, autoAlpha: on ? 1 : 0 });
    items[c.item] = { visible: on, x: CX + (ICON[0] * Math.cos(ra) - ICON[1] * Math.sin(ra)) * s,
                      y: y + (ICON[0] * Math.sin(ra) + ICON[1] * Math.cos(ra)) * s, rot: r, size: ITEM_H * s,
                      spin: 28 * Math.sin((t - c.t0) * Math.PI * 2 / 3.2) + (i % 2 ? -12 : 12) };
  });
  if (window.megaStage3D) window.megaStage3D.render({ bottle, box, items, burst });

  // ---- end card: logo drops in on top (T1-T2), the tagline wipes in under the bottle ----
  const te = t - (END_IN + 0.3);
  const lsE = kf(te, LS);
  gsap.set('#endlogo', { x: 540, y: 470 + (kf(te, HY.slice(0, 11)) - 640) * 0.9, scaleX: lsE, scaleY: lsE * kf(te, LSTRETCH),
                         autoAlpha: te >= 0 ? 1 : 0 });
  gsap.set('#tagline', { x: 540, y: 1158, clipPath: clip(kf(te, [[0.75, 0], [1.05, 1, 'power2.out']])), autoAlpha: te >= 0.75 ? 1 : 0 });
}

const tl = gsap.timeline({ paused: true, onUpdate: () => draw(tl.time()) });
tl.set({}, {}, DUR);
function fit() {
  const s = Math.min(innerWidth / 1080, innerHeight / 1920);
  gsap.set('#stage', { scale: s, x: (innerWidth - 1080 * s) / 2, y: (innerHeight - 1920 * s) / 2 });
}
addEventListener('resize', fit);
window.anim = {
  tl, duration: DUR,
  seek(t) { t = Math.min(DUR, Math.max(0, t)); tl.pause(); tl.time(t, false); draw(t); },
  play(from = 0) { tl.time(from); tl.play(); },
  pause() { tl.pause(); }
};
const qs = new URLSearchParams(location.search);
fit();
const ready3d = window.megaStage3D ? Promise.resolve() : new Promise((r) => addEventListener('stage3d-ready', r, { once: true }));
Promise.all([Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 3000))]), ready3d]).then(() => {
  anim.seek(0);
  if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
  else if (!qs.has('external')) tl.play(0);
  document.documentElement.dataset.ready = '1';
});
})();
</script>
</body>
</html>
