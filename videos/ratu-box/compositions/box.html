  <script>
    const tl = gsap.timeline({ paused: true });
    const TURN = 1.0;

    // Camera: a fixed downward look so the top of the box reads as 3D.
    tl.fromTo("#box-tilt", { rotationX: -16, y: -10, scale: 0.82 }, { rotationX: -11, y: 0, scale: 1, duration: 1.4, ease: "expo.out" }, 0);

    // Arrives turned, settles, then drifts slowly for the rest of the film.
    tl.fromTo("#box-drift", { rotationY: -30 }, { rotationY: 6, duration: 1.4, ease: "expo.out" }, 0);
    tl.fromTo("#box-drift", { rotationY: 6 }, { rotationY: -6, duration: 13.6, ease: "none", immediateRender: false }, 1.4);

    // Light: the face toward the viewer is lit, faces turned away are shaded.
    tl.set("#box-turn", { rotationY: 0 }, 0);
    tl.set("#box-top-shade", { opacity: 0.12 }, 0);
    tl.set("#box-front-shade", { opacity: 0 }, 0);
    tl.set(["#box-right-shade", "#box-back-shade", "#box-left-shade"], { opacity: 0.55 }, 0);

    // Quarter turns: Kopi Ratu -> Mega Ratu -> both together -> JRM Holistik.
    const turns = [
      { at: 3.2, from: 0, to: -90, out: "#box-front-shade", in: "#box-right-shade" },
      { at: 7.4, from: -90, to: -180, out: "#box-right-shade", in: "#box-back-shade" },
      { at: 11.4, from: -180, to: -270, out: "#box-back-shade", in: "#box-left-shade" },
    ];
    turns.forEach((t) => {
      tl.fromTo("#box-turn", { rotationY: t.from }, { rotationY: t.to, duration: TURN, ease: "power2.inOut", immediateRender: false }, t.at);
      tl.fromTo(t.out, { opacity: 0 }, { opacity: 0.55, duration: TURN, ease: "power2.inOut", immediateRender: false }, t.at);
      tl.fromTo(t.in, { opacity: 0.55 }, { opacity: 0, duration: TURN, ease: "power2.inOut", immediateRender: false }, t.at);
    });

    window.__timelines["box"] = tl;
  </script>
