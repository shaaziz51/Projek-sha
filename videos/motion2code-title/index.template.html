<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Ratu &amp; Kopi Ratu</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #1A0F0A; overflow: hidden }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
</style>
</head>
<body>
<!--
  Motion2Code rebuild of source.mp4 (1920x1080, 30 fps, 5.0 s).
  Contract: window.anim = { tl, duration, seek(t), play(from), pause() }
  ?t=2.5 freezes at 2.5 s, ?external=1 does not autoplay, no parameter plays and loops.
  Letters are the source font's glyph outlines (generated by build_index.py; edit the template, then rebuild).
-->
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="frame"><rect width="1920" height="1080"/></clipPath></defs>
  <g clip-path="url(#frame)">
    <rect id="bg" width="1920" height="1080" fill="#1A0F0A"/>
    <g id="title">
<!--LETTERS-->
    </g>
    <rect id="cursor" x="0" y="/*CURSOR_Y*/" width="8" height="/*CURSOR_H*/" fill="#D4A046"/>
  </g>
</svg>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
const DUR = 5;                                   // source.mp4 is exactly 5.0 s
const C = { ground: '#1A0F0A', cream: '#F3E5CC', gold: '#D39F44' };  // sampled from source.mp4 (cursor bar measured #D4A046)

// Typing, measured from the source: character i starts at 0.4 + 0.15*i s and fades in linearly over 0.12 s.
const TYPE_START = 0.4, TYPE_STEP = 0.15, FADE = 0.12, COUNT = /*COUNT*/;
const starts = Array.from({ length: COUNT }, (_, i) => TYPE_START + i * TYPE_STEP);
const CURSOR_X = /*CURSOR_X*/;                   // cursor left edge = pen position after k characters, + 10
const BLINK = 0.8;                               // once typing is done: on for 0.4 s, off for 0.4 s

// Loop return (added in code; the source ends on the full title):
// letters fade out while the source's cursor is already off, the cursor returns home at 4.8 s.
const RETURN_FADE = 4.5, HOME = 4.8;

// The opening frame, defined once: empty stage, cursor at the start of the line.
const OPEN = { letters: { opacity: 0 }, cursorX: Math.round(CURSOR_X[0] + 10) };

const tl = gsap.timeline({ paused: true, repeat: -1 });

function build() {
  gsap.set('.letter', OPEN.letters);
  // shot 1 (0.4-3.52 s): each glyph fades in, in reading order
  document.querySelectorAll('.letter').forEach(el => {
    const i = +el.dataset.i;
    tl.to(el, { opacity: 1, duration: FADE, ease: 'none' }, starts[i]);
  });
  // return (4.5-4.8 s): the title fades away, back to the opening frame
  tl.to('.letter', { ...OPEN.letters, duration: HOME - RETURN_FADE, ease: 'power1.in' }, RETURN_FADE)
    .set({}, {}, DUR);                           // pad to exactly DUR
  tl.eventCallback('onUpdate', () => draw(tl.time()));
}

// Cursor: a step function of t, so it lives in draw(t) on the same clock.
function draw(t) {
  const cursor = document.getElementById('cursor');
  if (t >= HOME) {                               // the loop's landing: same as t = 0
    cursor.setAttribute('x', OPEN.cursorX);
    cursor.style.visibility = 'visible';
    return;
  }
  let shown = 0;
  while (shown < COUNT && t - starts[shown] > 0) shown++;
  const typing = shown < COUNT;
  const on = typing || Math.floor(t / (BLINK / 2)) % 2 === 0;
  cursor.setAttribute('x', Math.round(CURSOR_X[shown] + 10));  // whole pixels, as in the source
  cursor.style.visibility = on ? 'visible' : 'hidden';
}

window.anim = {
  tl, duration: DUR,
  seek(t) { t = Math.min(DUR, Math.max(0, t)); tl.pause(); tl.time(t, false); draw(t >= DUR ? 0 : t); },
  play(from = 0) { tl.time(from); tl.play(); },
  pause() { tl.pause(); }
};

const qs = new URLSearchParams(location.search);
build();
anim.seek(0);
if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
else if (!qs.has('external')) tl.play(0);
document.documentElement.dataset.ready = '1';
})();
</script>
</body>
</html>
